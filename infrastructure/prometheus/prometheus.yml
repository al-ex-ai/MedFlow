global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'patient-service'
    static_configs:
      - targets: ['host.docker.internal:5025']
    metrics_path: '/metrics'

  - job_name: 'appointment-service'
    static_configs:
      - targets: ['host.docker.internal:5026']
    metrics_path: '/metrics'

  - job_name: 'billing-service'
    static_configs:
      - targets: ['host.docker.internal:5056']
    metrics_path: '/metrics'

  - job_name: 'notification-service'
    static_configs:
      - targets: ['host.docker.internal:5060']
    metrics_path: '/metrics'

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['host.docker.internal:5000']
    metrics_path: '/metrics'
